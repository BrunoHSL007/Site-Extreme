<div class="container">
    <button class="backmain" onclick='go("home")'>
        <img class="logosub" src="src/images/LOGO X.png">
    </button>

    <img class="logotitle" src="src/images/Agenda.png">


    <template id="card-template">
        <div class="titleItems textwithenter">
            <h1 class="title skeleton skeleton-text" data-title></h1>
            <h1 class="scheduletitle skeleton skeleton-text" data-scheduletitle></h1>
        </div>

        <p class="details skeleton skeleton-text skeleton-detail textwithenter" data-details></p>

        <button class="btn skeleton textwithenter" data-buttonInfo></button>

        <div class="post-container skeleton skeleton-image">
            <img class="post" src="" alt="" data-imagePost>
        </div>
        <div class="divider skeleton" data-divider></div>
    </template>  

    <div class="posts"></div>        

</div>

<script>

    function parseData(valor) {
        if (!/^\d{4}-\d{2}-\d{2}$/.test(valor)) return null;
        const [y, m, d] = valor.split("-");
        return new Date(y, m - 1, d);
    }

    let posts = document.querySelector('.posts');
    let cardtemplate = document.getElementById('card-template');
    for(let i = 0; i < 10; i++) {
        posts.append(cardtemplate.content.cloneNode(true));
    }

    let sheetsData = null;

    async function getData(){
        if(sheetsData) return sheetsData;
        console.log("Fetching data...");
        const res = await fetch("/.netlify/functions/getAgenda");
        sheetsData = await res.json();
        return sheetsData;
    }

    function clearSkeleton(container){
        container.querySelectorAll(".skeleton, .skeleton-text, .skeleton-image, .skeleton-detail")
            .forEach(el => {
                el.classList.remove("skeleton","skeleton-text","skeleton-image","skeleton-detail");
            });
    }

    getData()
    .then(data => {
        const postsDiv = document.querySelector('.posts');
        posts.innerHTML = '';

        data.map((item,count) => {
            // https://www.youtube.com/watch?v=ZVug65gW-fc
            
            const initialdate = parseData(item[3]);
            const finaldate = parseData(item[4]);
            const today = new Date();

            if ((initialdate !== null && initialdate > today) || (finaldate !== null && finaldate < today)) {
                return;
            }

            const div = cardtemplate.content.cloneNode(true);
            div.querySelector('[data-title]').textContent = item[0];
            div.querySelector('[data-scheduletitle]').textContent = item[2];
            div.querySelector('[data-details]').textContent = item[1];
            

            if(item[5] && item[6]){
                div.querySelector('[data-buttonInfo]').textContent = item[5];
                div.querySelector('[data-buttonInfo]').onclick = () => {
                    location.href = item[6];
                };
            }
            else{
                div.querySelector('[data-buttonInfo]').style = "display: none;"
            }

            if(item[7]){
                div.querySelector('[data-imagePost]').className = 'post';
                div.querySelector('[data-imagePost]').src = item[7];   
                div.querySelector('[data-imagePost]').onerror = function() {
                    this.style.display = 'none';
                };
            }                

            if(count == data.length - 1){
                div.querySelector('[data-divider]').style = "display: none;"
            }

            posts.appendChild(div);

        })
        clearSkeleton(posts);
    });
</script>
