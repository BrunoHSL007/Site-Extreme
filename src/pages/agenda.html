<div class="container">
    <button class="backmain" onclick='go("home")'>
        <img class="logosub" src="src/images/LOGOX.png">
    </button>

    <h1 class="presentationtitle">Agenda Extreme</h1>

    <template id="button-agenda-template">
        <button class="btn btn-secondary skeleton textwithenter"></button>            
    </template>

    <template id="image-agenda-template">
        <div class="post-container skeleton skeleton-image">
            <img class="post" src="" alt="">
        </div>
    </template>

    <template id="card-template">
        <div class="card">
            <div class="titleItems textwithenter">
                <h2 class="title skeleton skeleton-text" data-title></h2>
                <h2 class="scheduletitle skeleton skeleton-text" data-scheduletitle></h2>
            </div>

            <p class="details skeleton skeleton-text skeleton-detail textwithenter" data-details></p>

            <div class="skeleton textwithenter" data-buttonInfo></div>            

            <div class="skeleton skeleton-image" data-imagePost>
            </div>

        </div>
    </template>  

    <div class="posts"></div>        

</div>

<script>

    let posts = document.querySelector('.posts');
    let cardtemplate = document.getElementById('card-template');
    for(let i = 0; i < 10; i++) {
        posts.append(cardtemplate.content.cloneNode(true));
    }  

    getData("Eventos")
    .then(data => {
        const postsDiv = document.querySelector('.posts');
        posts.innerHTML = '';
        
        data.map((item,count) => {
            // https://www.youtube.com/watch?v=ZVug65gW-fc
            
            const initialdate = parseDate(item[3]);
            const finaldate = parseDate(item[4]);
            const today = new Date();

            if ((initialdate !== null && initialdate > today) || (finaldate !== null && finaldate < today)) {
                return;
            }

            const div = cardtemplate.content.cloneNode(true);
            div.querySelector('[data-title]').textContent = item[0];
            div.querySelector('[data-scheduletitle]').textContent = item[2];
            div.querySelector('[data-details]').textContent = item[1];           
            

            if(item[5] && item[6]){
                const buttonTemplate = document.getElementById('button-agenda-template');
                const buttonNames = item[5].split('\n');
                const buttonUrls = item[6].split('\n');                
                    
                buttonUrls.forEach((element,index) => {                    
                    let buttonDiv = buttonTemplate.content.cloneNode(true);
                    buttonDiv.firstElementChild.textContent = buttonNames[index];
                    buttonDiv.firstElementChild.onclick = () => {
                        location.href = element;
                    };
                    div.querySelector('[data-buttonInfo]').appendChild(buttonDiv);
                });
            }

            if(item[7]){
                const imageTemplate = document.getElementById('image-agenda-template');
                const imageUrls = item[7].split('\n');          

                imageUrls.forEach(element => {    
                    let imageDiv = imageTemplate.content.cloneNode(true);
                    imageDiv.firstElementChild.firstElementChild.className = 'post';
                    imageDiv.firstElementChild.firstElementChild.src = element;
                    imageDiv.firstElementChild.firstElementChild.onerror = function() {
                        this.style.display = 'none';
                    };
                    
                    div.querySelector('[data-imagePost]').appendChild(imageDiv);
                });
            }                

            posts.appendChild(div);

        })
        clearSkeleton(posts);

        if(posts.innerHTML ===""){
            const aviso = `<p class="textcenter details">Nada por aqui? :/<br/><br/>Mande uma mensagem aqui pedindo pra gente atualizar ;D</p><div class="spacer"></div>`;
            const buttonAviso = `<button onclick='location.href="https://ig.me/m/extreme06/"' class="btn">Chat Instagram</button>`
            posts.innerHTML = aviso+buttonAviso;
        }
        
    });
</script>
